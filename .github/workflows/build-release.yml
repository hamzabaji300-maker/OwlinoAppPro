name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK to Actions (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Owlino-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plus-${{ github.run_number }}
          name: Owlino Plus ${{ github.run_number }}
          make_latest: true
          files: app/build/outputs/apk/release/*.apk
